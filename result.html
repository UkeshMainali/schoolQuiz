<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Student Result</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="dashboard.html">Classroom Quiz <small>Teacher</small></a>
      <a href="dashboard.html" class="btn btn-small">← Back to results</a>
    </div>
  </header>

  <main class="container container-wide">
    <div id="loading" class="loading"><span class="spinner"></span> Loading result…</div>
    <div id="notice" class="notice" hidden></div>

    <div id="content" hidden>
      <section class="card">
        <div class="result-head">
          <div>
            <h1 id="studentName"></h1>
            <p class="muted" id="studentMeta"></p>
          </div>
          <div id="statusBadge"></div>
        </div>
        <div class="summary-grid" id="resultCards"></div>
        <dl class="info-grid" id="infoGrid"></dl>
        <div class="result-actions">
          <button type="button" id="gradeBtn" class="btn btn-primary btn-small" hidden>Grade now</button>
          <button type="button" id="printBtn" class="btn btn-small">Print</button>
          <button type="button" id="retakeBtn" class="btn btn-danger btn-small">Allow retake</button>
        </div>
      </section>

      <section class="card" id="answersCard">
        <h2>Answers</h2>
        <p class="small muted">Shown in the order this student saw the questions. For short answers you can override the automatic marking (for example, a small spelling mistake).</p>
        <div class="table-wrap">
          <table class="data-table compact">
            <thead><tr><th>#</th><th>Question</th><th>Student's answer</th><th>Correct answer</th><th>Result</th><th class="num">Marks</th></tr></thead>
            <tbody id="answersBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card" id="activityCard">
        <h2>Quiz activity</h2>
        <div id="activity"></div>
      </section>
    </div>
  </main>

  <div id="confirmModal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText"></p>
      <div class="actions">
        <button type="button" class="btn" id="confirmCancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmOk">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/result.js"></script>
</body>
</html>
