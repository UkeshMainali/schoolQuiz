<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom Quiz</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">CQ</span>Classroom Quiz</a>
    </div>
  </header>

  <main class="container">
    <div id="loading" class="loading"><span class="spinner"></span> Loading…</div>
    <div id="notice" class="notice" hidden></div>

    <!-- Student details (first visit, or "Change details") -->
    <section id="profileCard" class="card" hidden>
      <h1 id="profileTitle">Welcome! Tell us who you are</h1>
      <p class="muted" id="profileIntro">Saved on this device so you only type it once.</p>
      <form id="profileForm" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" autocomplete="name" maxlength="80" placeholder="e.g. Ram Sharma" required>
          <div class="error-text" data-error-for="fullName" hidden></div>
        </div>
        <div class="field">
          <label for="rollNo">Roll number</label>
          <input type="text" id="rollNo" inputmode="numeric" maxlength="6" placeholder="e.g. 12" required>
          <div class="error-text" data-error-for="rollNo" hidden></div>
        </div>
        <div class="row">
          <div class="field">
            <label for="grade">Grade</label>
            <select id="grade" required></select>
            <div class="error-text" data-error-for="grade" hidden></div>
          </div>
          <div class="field">
            <label for="section">Section</label>
            <select id="section" required></select>
            <div class="error-text" data-error-for="section" hidden></div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="cancelProfileBtn" class="btn" hidden>Cancel</button>
          <button type="submit" id="saveProfileBtn" class="btn btn-primary">Save and see my quizzes</button>
        </div>
      </form>
    </section>

    <!-- Quiz list -->
    <section id="homeView" hidden>
      <div class="profile-bar card">
        <div>
          <div class="profile-name" id="profileName"></div>
          <div class="muted small" id="profileMeta"></div>
        </div>
        <div class="profile-actions">
          <button type="button" id="editProfileBtn" class="btn btn-small">Change details</button>
          <button type="button" id="switchStudentBtn" class="btn btn-small">Not you? Switch student</button>
        </div>
      </div>

      <div class="list-head">
        <h1>Your quizzes</h1>
        <span id="progressText" class="muted small"></span>
      </div>
      <div id="quizList" class="quiz-list" aria-live="polite"></div>
    </section>

    <p class="small muted center footer-link"><a href="dashboard.html">Teacher login</a></p>
  </main>

  <!-- Confirm before starting -->
  <div id="confirmModal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Start this quiz?</h2>
      <dl class="details-list" id="confirmDetails"></dl>
      <p class="small muted">Check your details. They cannot be changed once the quiz starts.</p>
      <div class="actions">
        <button type="button" class="btn" id="confirmBack">Go back</button>
        <button type="button" class="btn btn-primary" id="confirmStart">Start quiz</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
