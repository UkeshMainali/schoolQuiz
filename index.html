<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classroom Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">CQ</span>Classroom Quiz</a>
      <nav class="header-actions" aria-label="Site">
        <a class="btn btn-ghost btn-header" href="about.html" data-icon="circle-info" aria-label="About"><span class="btn-text">About</span></a>
        <a class="btn btn-header btn-header-primary" href="dashboard.html" data-icon="chalkboard-user" aria-label="Teacher login"><span class="btn-text">Teacher login</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="loading"><div class="skeleton" role="status" aria-busy="true"><span class="sr-only">Loading…</span><div class="skel-list"><div class="card skel-card skel-item"><div><span class="skel skel-title" style="width:66%"></span><span class="skel " style="width:33%"></span></div><span class="skel skel-btn" style="width:18%"></span></div><div class="card skel-card skel-item"><div><span class="skel skel-title" style="width:52%"></span><span class="skel " style="width:26%"></span></div><span class="skel skel-btn" style="width:18%"></span></div><div class="card skel-card skel-item"><div><span class="skel skel-title" style="width:60%"></span><span class="skel " style="width:30%"></span></div><span class="skel skel-btn" style="width:18%"></span></div></div></div></div>
    <div id="notice" class="notice" hidden></div>

    <!-- Student details (first visit, or "Change details") -->
    <section id="profileCard" class="card" hidden>
      <h1 id="profileTitle">Welcome! Tell us who you are</h1>
      <p class="muted" id="profileIntro">Saved on this device so you only type it once.</p>
      <form id="profileForm" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" autocomplete="name" maxlength="80" placeholder="e.g. Ram Sharma" required>
          <div class="error-text" data-error-for="fullName" hidden></div>
        </div>
        <div class="field">
          <label for="rollNo">Roll number</label>
          <input type="text" id="rollNo" inputmode="numeric" maxlength="6" placeholder="e.g. 12" required aria-describedby="rollHint">
          <div class="hint" id="rollHint" hidden></div>
          <div class="error-text" data-error-for="rollNo" hidden role="alert"></div>
        </div>
        <div class="row">
          <div class="field">
            <label for="grade">Grade</label>
            <select id="grade" required></select>
            <div class="error-text" data-error-for="grade" hidden></div>
          </div>
          <div class="field">
            <label for="section">Section</label>
            <select id="section" required></select>
            <div class="error-text" data-error-for="section" hidden></div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="cancelProfileBtn" class="btn" hidden>Cancel</button>
          <button type="submit" id="saveProfileBtn" class="btn btn-primary">Save and see my quizzes</button>
        </div>
      </form>
    </section>

    <!-- Quiz list -->
    <section id="homeView" hidden>
      <div class="profile-bar card">
        <div>
          <div class="profile-name" id="profileName"></div>
          <div class="muted small" id="profileMeta"></div>
        </div>
        <div class="profile-actions">
          <button type="button" id="editProfileBtn" class="btn btn-small">Change details</button>
          <button type="button" id="switchStudentBtn" class="btn btn-small">Not you? Switch student</button>
        </div>
      </div>

      <div class="list-head">
        <h1>Your quizzes</h1>
        <span id="progressText" class="muted small"></span>
      </div>
      <div id="quizList" class="quiz-list" aria-live="polite"></div>
    </section>

  </main>

  <footer class="site-footer">
    <span>Classroom Quiz</span>
    <span class="dot-sep" aria-hidden="true">·</span>
    <a href="about.html">About</a>
    <span class="dot-sep" aria-hidden="true">·</span>
    <span>Created by <a href="https://www.instagram.com/mainaliukesh.143783333/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram" aria-hidden="true"></i> @mainaliukesh.143783333</a></span>
  </footer>

  <!-- Confirm before starting -->
  <div id="confirmModal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Start this quiz?</h2>
      <dl class="details-list" id="confirmDetails"></dl>
      <p class="small muted">Check your details. They cannot be changed once the quiz starts.</p>
      <div class="actions">
        <button type="button" class="btn" id="confirmBack">Go back</button>
        <button type="button" class="btn btn-primary" id="confirmStart">Start quiz</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
