<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Student Result</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="teacher">
  <header class="site-header">
    <div class="inner">
      <div class="brand-wrap">
        <a class="brand" href="index.html" title="Go to the student homepage"><span class="brand-mark" aria-hidden="true">CQ</span>Classroom Quiz</a>
        <a class="area-link" href="dashboard.html">Teacher dashboard</a>
      </div>
      <a href="dashboard.html" class="btn btn-small" id="backLink">← Back to results</a>
    </div>
  </header>

  <main class="container container-wide">
    <div id="loading" class="loading"><span class="spinner"></span> Loading result…</div>
    <div id="notice" class="notice" hidden></div>

    <div id="content" hidden>
      <section class="card">
        <div class="result-head">
          <div>
            <h1 id="studentName"></h1>
            <p class="muted" id="studentMeta"></p>
          </div>
          <div id="statusBadge" class="status-stack"></div>
        </div>
        <div class="summary-grid" id="resultCards"></div>
        <dl class="info-grid" id="infoGrid"></dl>
        <div class="result-actions" id="actions"></div>
      </section>

      <section class="card" id="answersCard">
        <h2>Answers</h2>
        <p class="small muted">In the order the student saw them. You can change the marking of short answers.</p>
        <div class="table-wrap">
          <table class="data-table compact">
            <thead><tr><th>#</th><th>Question</th><th>Student's answer</th><th>Correct answer</th><th>Result</th><th class="num">Marks</th></tr></thead>
            <tbody id="answersBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card" id="activityCard">
        <h2>Quiz activity</h2>
        <div id="activity"></div>
      </section>
    </div>
  </main>

  <script type="module" src="js/result.js"></script>
</body>
</html>
