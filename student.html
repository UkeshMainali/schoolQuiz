<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Student History · EES</title>
  <meta name="theme-color" content="#1A73E8">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Student history now lives on the dashboard ("Student history" tab).
    // Older links (student.html?grade=6&section=A&roll=12) are forwarded there.
    (function () {
      var p = new URLSearchParams(location.search);
      var parts = [p.get("grade"), p.get("section"), p.get("roll")];
      var hash = parts.every(Boolean) ? "#history=" + parts.map(encodeURIComponent).join("|") : "";
      if (!hash) try { localStorage.setItem("cq_dash_tab", "history"); } catch (e) {}
      location.replace("dashboard.html" + hash);
    })();
  </script>
</head>
<body>
  <main class="container"><p><a href="dashboard.html">Open the teacher dashboard</a></p></main>
</body>
</html>
