<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Student Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="teacher">
  <header class="site-header">
    <div class="inner">
      <div class="brand-wrap">
        <a class="brand" href="index.html" title="Go to the student homepage"><span class="brand-mark" aria-hidden="true">CQ</span>Classroom Quiz</a>
        <a class="area-link" href="dashboard.html">Teacher dashboard</a>
      </div>
      <a href="dashboard.html" class="btn btn-small" id="backLink">← Back to results</a>
    </div>
  </header>

  <main class="container container-wide">
    <div id="loading"><div class="skeleton" role="status" aria-busy="true"><span class="sr-only">Loading result…</span><div class="skel-cards"><div class="card skel-card"><span class="skel " style="width:50%"></span><span class="skel skel-title" style="width:30%"></span></div><div class="card skel-card"><span class="skel " style="width:50%"></span><span class="skel skel-title" style="width:30%"></span></div><div class="card skel-card"><span class="skel " style="width:50%"></span><span class="skel skel-title" style="width:30%"></span></div><div class="card skel-card"><span class="skel " style="width:50%"></span><span class="skel skel-title" style="width:30%"></span></div></div><div class="card skel-card"><div class="skel-head"><span class="skel skel-title" style="width:28%"></span><span class="skel " style="width:14%"></span></div><table class="data-table skel-table"><tbody><tr class="skel-row"><td><span class="skel " style="width:72%"></span></td><td><span class="skel " style="width:48%"></span></td><td><span class="skel " style="width:30%"></span></td><td><span class="skel " style="width:60%"></span></td></tr><tr class="skel-row"><td><span class="skel " style="width:48%"></span></td><td><span class="skel " style="width:30%"></span></td><td><span class="skel " style="width:60%"></span></td><td><span class="skel " style="width:38%"></span></td></tr><tr class="skel-row"><td><span class="skel " style="width:30%"></span></td><td><span class="skel " style="width:60%"></span></td><td><span class="skel " style="width:38%"></span></td><td><span class="skel " style="width:54%"></span></td></tr><tr class="skel-row"><td><span class="skel " style="width:60%"></span></td><td><span class="skel " style="width:38%"></span></td><td><span class="skel " style="width:54%"></span></td><td><span class="skel " style="width:44%"></span></td></tr><tr class="skel-row"><td><span class="skel " style="width:38%"></span></td><td><span class="skel " style="width:54%"></span></td><td><span class="skel " style="width:44%"></span></td><td><span class="skel " style="width:66%"></span></td></tr></tbody></table></div></div></div>
    <div id="notice" class="notice" hidden></div>

    <div id="content" hidden>
      <section class="card">
        <div class="result-head">
          <div>
            <h1 id="studentName"></h1>
            <p class="muted" id="studentMeta"></p>
          </div>
          <div id="statusBadge" class="status-stack"></div>
        </div>
        <div class="summary-grid" id="resultCards"></div>
        <dl class="info-grid" id="infoGrid"></dl>
        <div class="result-actions" id="actions"></div>
      </section>

      <section class="card" id="answersCard">
        <h2>Answers</h2>
        <p class="small muted">In the order the student saw them. You can change the marking of short answers.</p>
        <div class="table-wrap">
          <table class="data-table compact">
            <thead><tr><th>#</th><th>Question</th><th>Student's answer</th><th>Correct answer</th><th>Result</th><th class="num">Marks</th></tr></thead>
            <tbody id="answersBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card" id="activityCard">
        <h2>Quiz activity</h2>
        <div id="activity"></div>
      </section>
    </div>
  </main>

  <script type="module" src="js/result.js"></script>
</body>
</html>
